# Self-hosted release for this fork: builds unsigned wordcraft + wordcraft-cli for Linux x64,
# Windows x64 and macOS arm64, and publishes them as a GitHub Release. Needs no secrets beyond the
# built-in GITHUB_TOKEN (the upstream workflow signs with Apple/Azure certificates we don't have).
#
# Release: push a tag (`git tag v0.6.1 && git push origin v0.6.1`), or run it manually from the
# Actions tab (tag defaults to `v` + the workspace version in Cargo.toml).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.6.1 (empty: v + Cargo.toml version)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  prepare:
    name: Create draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="v$version"
          fi
          if [ "$tag" != "v$version" ]; then
            echo "::warning::tag $tag differs from Cargo.toml version $version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; delete it or pick another tag"
            exit 1
          fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "WordCraft $TAG" \
            --generate-notes

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies (winit, wgpu, rfd)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libasound2-dev libgl1-mesa-dev

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          # Fail the Windows build if the icon/VERSIONINFO can't be embedded (apps/wordcraft/build.rs).
          WORDCRAFT_REQUIRE_WINRES: ${{ runner.os == 'Windows' && '1' || '' }}
        run: |
          if [ -z "$WORDCRAFT_REQUIRE_WINRES" ]; then unset WORDCRAFT_REQUIRE_WINRES; fi
          cargo build --release --locked --target ${{ matrix.target }} -p wordcraft -p wordcraft-cli

      - name: Smoke test CLI
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          "target/${{ matrix.target }}/release/wordcraft-cli$ext" --version

      - name: Package
        id: package
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          dir="wordcraft-$TAG-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/wordcraft$ext" \
             "target/${{ matrix.target }}/release/wordcraft-cli$ext" \
             README.md LICENSE-APACHE LICENSE-MIT NOTICE ATTRIBUTION.md "$dir/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            archive="$dir.zip"
            7z a -tzip "$archive" "$dir" >/dev/null
          else
            archive="$dir.tar.gz"
            tar -czf "$archive" "$dir"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" "${{ steps.package.outputs.archive }}" --clobber

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
